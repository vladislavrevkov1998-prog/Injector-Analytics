name: Package Python 3.10 IDLE TXT archive
on:
  push:
    branches:
      - delivery/python310-restorer-v085

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check original ZIP and replace one TXT file
        run: |
          echo "d15163d63109d2558960ff4263416de3780d0e8e6aa4c83d447cb0b3c9eda463  txt/Fuel_Field_Pilot_0.8.5_IDLE_TXT.zip" | sha256sum -c -
          mkdir -p dist
          unzip -q txt/Fuel_Field_Pilot_0.8.5_IDLE_TXT.zip -d dist
          cp 'delivery/ВОССТАНОВИТЬ_ПРОГРАММУ_Python310.txt' 'dist/Fuel_Field_Pilot_0.8.5_TXT/ВОССТАНОВИТЬ_ПРОГРАММУ.txt'
          test "$(find dist -type f | wc -l)" -eq 65
          python -c "import ast, pathlib; p=pathlib.Path('dist/Fuel_Field_Pilot_0.8.5_TXT/ВОССТАНОВИТЬ_ПРОГРАММУ.txt'); ast.parse(p.read_text(encoding='utf-8'), feature_version=(3,10)); print('Python 3.10 syntax validated')"
      - name: Publish full corrected ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Fuel_Field_Pilot_0.8.5_IDLE_TXT_Python310
          path: dist/
          if-no-files-found: error
          retention-days: 30
